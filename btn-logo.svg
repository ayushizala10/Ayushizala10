<svg xmlns="http://www.w3.org/2000/svg" width="170" height="76" viewBox="0 0 170 76">
<defs><filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
  <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="softglow" x="-30%" y="-30%" width="160%" height="160%">
  <feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect x="5" y="5" width="160" height="66" rx="16" fill="#05070f" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow)">
<animate attributeName="stroke-opacity" values="1;0.55;1" dur="3s" repeatCount="indefinite"/></rect>
<g transform="translate(85.0,38.0) scale(1.5)" filter="url(#softglow)"><g fill="none" stroke="#38bdf8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="-5,-8 -12,0 -5,8"/><polyline points="5,-8 12,0 5,8"/><line x1="2" y1="-11" x2="-2" y2="11"/></g></g></svg>