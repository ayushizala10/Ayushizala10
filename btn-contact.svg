<svg xmlns="http://www.w3.org/2000/svg" width="190" height="76" viewBox="0 0 190 76">
<defs><filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
  <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="softglow" x="-30%" y="-30%" width="160%" height="160%">
  <feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect x="5" y="5" width="180" height="66" rx="16" fill="#05070f" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow)">
<animate attributeName="stroke-opacity" values="1;0.55;1" dur="3s" repeatCount="indefinite"/></rect>
<g transform="translate(46,38.0)" filter="url(#softglow)"><g fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linejoin="round"><rect x="-11" y="-8" width="22" height="16" rx="2"/><polyline points="-11,-7 0,2 11,-7"/></g></g><text x="72" y="45.0" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="600" fill="#e0f2fe">Contact</text></svg>